# ============================
# Dataset: PathVQA
# ============================
dataset:
  name: pathvqai
  text_index: ../retriever/pathvqa/text.index
  text_metadata: ../retriever/pathvqa/texts.json
  image_index: ../retriever/pathvqa/image.index
  image_metadata: ../retriever/pathvqa/image_texts.json
  json_dir: ../dataset/pathvqa/json_files
  images_root: ../dataset/pathvqa/images

# =======================================
# RAG CONFIGURATION (ACTIVE)
# HyDE + Decomposition + Reranker
# =======================================

rewrite:
  strategy: hyde
  params:
    max_versions: 1

rewrites:
  - strategy: hyde
    params:
      max_versions: 2
  - strategy: decomposition
    params:
      max_subquestions: 3

reranker:
  type: crossencoder
  model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 8
  
llm:
  provider: transformers
  model_id: google/flan-t5-large
  task: text2text-generation
  max_new_tokens: 128
  temperature: 0.5
  top_p: 0.9

# =======================================
# BASELINE CONFIGURATION
# No rewrite, no decomposition, no reranker
# =======================================

